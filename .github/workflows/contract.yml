# בדיקת חוזה טבלאות ה-patch מול צד ה-Kotlin (Otzaria/SeforimLibrary).
# המאגר ציבורי כרגע ולכן אין צורך ב-token; אם יהפוך לפרטי יש להוסיף
# ל-checkout שלו `token: ${{ secrets.CONTRACT_REPO_TOKEN }}` ולהגדיר את ה-secret.
name: contract

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    env:
      KOTLIN_FIXTURE: seforim-library/generator/common/src/jvmTest/resources/patch_tables_contract.json
    steps:
      - uses: actions/checkout@v4

      # A coordinated contract change spans two repositories. On a PR, prefer
      # a linked open companion PR by the same author; on push (or when none is
      # linked) keep validating against the companion's default branch.
      - name: Resolve linked SeforimLibrary PR
        id: seforim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=Otzaria/SeforimLibrary
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            marker="$GITHUB_REPOSITORY#${{ github.event.pull_request.number }}"
            author='${{ github.event.pull_request.user.login }}'
            number=$(gh api -X GET search/issues \
              -f q="repo:$repo is:pr is:open author:$author \"$marker\"" \
              --jq '.items[0].number // empty')
            if [ -n "$number" ]; then
              companion_repo=$(gh api "repos/$repo/pulls/$number" --jq .head.repo.full_name)
              companion_ref=$(gh api "repos/$repo/pulls/$number" --jq .head.ref)
              echo "repository=$companion_repo" >> "$GITHUB_OUTPUT"
              echo "ref=$companion_ref" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "repository=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=otzaria" >> "$GITHUB_OUTPUT"

      - name: Checkout Otzaria/SeforimLibrary (צד ה-Kotlin)
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.seforim.outputs.repository }}
          ref: ${{ steps.seforim.outputs.ref }}
          path: seforim-library

      # נתיב שגוי חייב להיכשל בקול רם, לא להתדלג בשקט בבדיקת ה-Dart
      - name: Verify Kotlin fixture exists
        run: test -f "$KOTLIN_FIXTURE"

      # השוואת בתים ישירה בין שני ה-fixtures — בלתי תלויה ב-Dart
      - name: cmp fixtures (byte-identical)
        run: cmp test/patch_tables_contract.json "$KOTLIN_FIXTURE"

      - uses: dart-lang/setup-dart@v1

      - run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Run full test suite
        env:
          SEFORIM_LIBRARY_REPO: ${{ github.workspace }}/seforim-library
        run: dart test

      - name: Run contract tests (fail on skip)
        env:
          SEFORIM_LIBRARY_REPO: ${{ github.workspace }}/seforim-library
        run: |
          set -euo pipefail
          dart test test/patch_tables_contract_test.dart -r expanded | tee contract_test_output.txt
          if grep -Eiq '(skipped|\+[0-9]+ ~[0-9]+)' contract_test_output.txt; then
            echo '::error::בדיקת החוזה דולגה — SEFORIM_LIBRARY_REPO לא נקלט או שה-fixture חסר'
            exit 1
          fi
